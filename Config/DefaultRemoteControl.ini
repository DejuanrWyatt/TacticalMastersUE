[/Script/RemoteControlCommon.RemoteControlSettings]
; Lets the editor be driven from outside over Remote Control, which is how the
; level, the lighting and the character setup are built here instead of by
; clicking through menus.
;
; This is a local development convenience and a real one to be aware of: with
; these on, anything that can reach the Remote Control port can run Python in
; your editor. The server binds locally and the port is not exposed, but do not
; turn these on for a machine on an untrusted network, and there is no reason
; for them to be on in a packaged build.
bAllowAnyRemoteFunctionCall=True
bEnableRemotePythonExecution=True
bAllowConsoleCommandRemoteExecution=True
