[/Script/UnrealEd.EditorLoadingSavingSettings]
; Content/Data holds the game's plain data files -- classes, maps, the character
; map, sounds, icons -- which the game reads as they are. Unreal would otherwise
; offer to import every one it sees change. Localization/* is the engine's own
; default, kept.
-AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint=,Wildcards=((Wildcard="Localization/*")))
+AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint=,Wildcards=((Wildcard="Localization/*"),(Wildcard="Data/*",bInclude=False)))
